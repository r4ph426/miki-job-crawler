name: Miki delivery watchdog

on:
  schedule:
    # Provider polling from 08:40 Berlin across DST, plus retries. Never resends.
    - cron: "40,50 6,7,8 * * 1-5"
  workflow_dispatch:

concurrency:
  group: miki-weekday-service
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    if: github.event_name != 'schedule' || vars.SERVICE_ENABLED != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate service
        run: python3 -m unittest discover -s tests -v
      - name: Check today delivery
        env:
          STATE_BRANCH: ${{ github.event.repository.default_branch }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'brevo' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || vars.MAIL_FROM || secrets.GMAIL_USER || vars.GMAIL_USER }}
          GMAIL_USER: ${{ secrets.GMAIL_USER || vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_ALERT_TO: ${{ secrets.MAIL_ALERT_TO || vars.MAIL_ALERT_TO }}
          MAIL_TO: ${{ secrets.MAIL_TO || vars.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC || vars.MAIL_CC }}
        run: |
          set -euo pipefail
          git config user.name "miki-jobsearch-bot"
          git config user.email "miki-jobsearch-bot@users.noreply.github.com"
          python3 -m miki_jobsearch.hybrid --actor github --task delivery-check
      - name: Upload safe readiness records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miki-delivery-watchdog-${{ github.run_id }}
          path: |
            state/runs/
            state/delivery-alerts/
            state/status-feed.json
          if-no-files-found: ignore
          retention-days: 30
