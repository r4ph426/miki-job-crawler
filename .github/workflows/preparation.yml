name: Miki advance research and readiness check

on:
  schedule:
    # Sunday–Thursday prepares the next calendar weekday. Both Berlin DST offsets.
    - cron: "0 7,8,11,12 * * 0-4"
    # 09:00 preparation and 13:00 retries; local guards cover both DST offsets.
    # GitHub readiness backup from 16:00 Berlin, plus a retry.
    - cron: "0,30 14,15,16 * * 0-4"
  workflow_dispatch:
    inputs:
      task:
        description: "Scheduled-window preparation or readiness check"
        type: choice
        options: [prepare-next, readiness-check]
        default: prepare-next

concurrency:
  group: miki-weekday-service
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    if: github.event_name != 'schedule' || vars.SERVICE_ENABLED != 'false'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate service
        run: python3 -m unittest discover -s tests -v
      - name: Prepare tomorrow or check readiness
        env:
          TASK: ${{ inputs.task || (contains(github.event.schedule, '7,8,11,12') && 'prepare-next' || 'readiness-check') }}
          STATE_BRANCH: ${{ github.event.repository.default_branch }}
          MIKI_OPENAI_API_KEY: ${{ secrets.MIKI_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'brevo' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || vars.MAIL_FROM || secrets.GMAIL_USER || vars.GMAIL_USER }}
          GMAIL_USER: ${{ secrets.GMAIL_USER || vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_ALERT_TO: ${{ secrets.MAIL_ALERT_TO || vars.MAIL_ALERT_TO }}
          MAIL_TO: ${{ secrets.MAIL_TO || vars.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC || vars.MAIL_CC }}
        run: |
          set -euo pipefail
          git config user.name "miki-jobsearch-bot"
          git config user.email "miki-jobsearch-bot@users.noreply.github.com"
          python3 -m miki_jobsearch.hybrid --actor github --task "$TASK"
      - name: Upload safe readiness records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miki-preparation-${{ github.run_id }}
          path: |
            state/runs/
            state/alerts/
            state/status-feed.json
          if-no-files-found: ignore
          retention-days: 30
