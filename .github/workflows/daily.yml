name: Miki weekday job search

on:
  schedule:
    # Prepared-only 08:30 delivery across DST, plus retry. Never starts research.
    - cron: "30 6,7,8 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Offline demo, live research without email, or production delivery"
        type: choice
        options: [offline-demo, live-dry-run, prepare, prepare-next, send]
        default: offline-demo
      runner:
        description: "Hosted runner pool; alternate pools are available if acquisition fails"
        type: choice
        options: [ubuntu-24.04-arm, ubuntu-24.04, macos-15]
        default: ubuntu-24.04-arm
      revision:
        description: "Optional explicit revision ID for an authorized correction (preserves the original)"
        type: string
        default: ""
      revision_reason:
        description: "Required explanation when requesting a revision"
        type: string
        default: ""

concurrency:
  group: miki-weekday-service
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.event_name != 'schedule' || vars.SERVICE_ENABLED != 'false'
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the service
        run: python3 -m unittest discover -s tests -v
      - name: Check and record production credential readiness
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'offline-demo' && inputs.mode != 'prepare-next'
        env:
          RUN_MODE: ${{ github.event_name != 'workflow_dispatch' && 'hybrid' || inputs.mode }}
          REPORT_REVISION: ${{ inputs.revision }}
          REVISION_REASON: ${{ inputs.revision_reason }}
          MIKI_OPENAI_API_KEY: ${{ secrets.MIKI_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'brevo' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || vars.MAIL_FROM || secrets.GMAIL_USER || vars.GMAIL_USER }}
          GMAIL_USER: ${{ secrets.GMAIL_USER || vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO || vars.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC || vars.MAIL_CC }}
        run: |
          set -euo pipefail
          git config user.name "miki-jobsearch-bot"
          git config user.email "miki-jobsearch-bot@users.noreply.github.com"
          python3 scripts/deployment_check.py
          git add -- state/deployment.json
          if ! git diff --cached --quiet -- state/deployment.json; then
            git commit --only -m "Record Miki deployment credential readiness" -- state/deployment.json
            git push origin HEAD:refs/heads/main
          fi
      - name: Run research and optional delivery
        env:
          RUN_MODE: ${{ github.event_name != 'workflow_dispatch' && 'hybrid' || inputs.mode }}
          REPORT_REVISION: ${{ inputs.revision }}
          REVISION_REASON: ${{ inputs.revision_reason }}
          MIKI_OPENAI_API_KEY: ${{ secrets.MIKI_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'brevo' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || vars.MAIL_FROM || secrets.GMAIL_USER || vars.GMAIL_USER }}
          GMAIL_USER: ${{ secrets.GMAIL_USER || vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO || vars.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC || vars.MAIL_CC }}
          STATE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "miki-jobsearch-bot"
          git config user.email "miki-jobsearch-bot@users.noreply.github.com"
          revision_args=()
          if [ -n "$REPORT_REVISION" ]; then
            revision_args=(--revision "$REPORT_REVISION" --revision-reason "$REVISION_REASON")
          fi
          case "$RUN_MODE" in
            hybrid)
              python3 -m miki_jobsearch.hybrid --actor github
              ;;
            offline-demo)
              python3 -m miki_jobsearch run --fixture tests/fixtures/report.json --dry-run
              ;;
            live-dry-run)
              python3 -m miki_jobsearch run --dry-run
              ;;
            send)
              python3 -m miki_jobsearch run --send --persist-git "${revision_args[@]}"
              ;;
            prepare-next)
              python3 -m miki_jobsearch.hybrid --actor github --manual-prepare --refresh
              ;;
            prepare)
              python3 -m miki_jobsearch run --prepare --persist-git "${revision_args[@]}"
              ;;
            *) exit 2 ;;
          esac
      - name: Upload generated reports and run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miki-run-${{ github.run_id }}
          path: |
            out/
            state/runs/
            state/deployment.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Delivery status
        if: always()
        run: |
          python3 -m miki_jobsearch status > /tmp/miki-status.json
          python3 scripts/workflow_summary.py /tmp/miki-status.json >> "$GITHUB_STEP_SUMMARY"
